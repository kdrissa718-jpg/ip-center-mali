
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe - IP Center Mali</title>

    <meta name="robots" content="noindex, nofollow">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f2f5fa;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        h1 {
            color: #123c70;
            font-size: 24px;
            text-align: center;
            margin-bottom: 12px;
        }

        .description {
            color: #64748b;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            color: #334155;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1769aa;
            box-shadow: 0 0 0 3px rgba(23,105,170,.12);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            background: #1261a0;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0b477b;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
            line-height: 1.5;
        }

        .success {
            display: block !important;
            color: #166534;
            background: #dcfce7;
        }

        .error {
            display: block !important;
            color: #991b1b;
            background: #fee2e2;
        }

        .back {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #1261a0;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        #resetForm {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Nouveau mot de passe</h1>

    <p class="description">
        Choisissez un nouveau mot de passe sécurisé
        pour votre compte IP Center Mali.
    </p>

    <div id="loading">
        Vérification de votre lien de récupération...
    </div>

    <form id="resetForm">

        <label for="password">Nouveau mot de passe</label>
        <input
            type="password"
            id="password"
            minlength="8"
            autocomplete="new-password"
            placeholder="Minimum 8 caractères"
            required
        >

        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input
            type="password"
            id="confirmPassword"
            minlength="8"
            autocomplete="new-password"
            placeholder="Répétez le mot de passe"
            required
        >

        <button type="submit" id="submitBtn">
            Enregistrer le nouveau mot de passe
        </button>

    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <a href="login.html" class="back">
        Retour à la connexion
    </a>

</div>

<!-- Bibliothèque Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Client Supabase existant du projet -->
<script src="js/scriptsupabase.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const form = document.getElementById("resetForm");
    const loading = document.getElementById("loading");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
    }

    if (!window.supabaseClient) {
        loading.textContent =
            "Impossible d'initialiser la connexion Supabase.";
        return;
    }

    const client = window.supabaseClient;

    // Vérifier la session issue du lien de récupération
    try {
        const { data, error } = await client.auth.getSession();

        if (error || !data.session) {
            loading.textContent =
                "Votre lien est invalide ou expiré. Demandez un nouveau lien de récupération.";
            return;
        }

        loading.style.display = "none";
        form.style.display = "block";

    } catch (error) {
        loading.textContent =
            "Une erreur est survenue pendant la vérification du lien.";
        return;
    }

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const password =
            document.getElementById("password").value;

        const confirmation =
            document.getElementById("confirmPassword").value;

        if (password.length < 8) {
            showMessage(
                "Le mot de passe doit contenir au moins 8 caractères.",
                "error"
            );
            return;
        }

        if (password !== confirmation) {
            showMessage(
                "Les deux mots de passe ne correspondent pas.",
                "error"
            );
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Enregistrement en cours...";

        try {

            const { data, error } = await client.auth.updateUser({
                password: password
            });

            if (error) throw error;

            if (!data.user) {
                throw new Error("Utilisateur non confirmé.");
            }

            form.style.display = "none";

            showMessage(
                "Votre mot de passe a été modifié avec succès. Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.",
                "success"
            );

            // Fermer la session de récupération
            await client.auth.signOut();

        } catch (error) {

            showMessage(
                error.message || "Impossible de modifier le mot de passe.",
                "error"
            );

            submitBtn.disabled = false;
            submitBtn.textContent =
                "Enregistrer le nouveau mot de passe";
        }
    });

});
</script>

</body>
</html>
